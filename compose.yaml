services:
  app:
    build:
      context: .
      target: development
    init: true
    working_dir: /app
    environment:
      LAVEMILL_DATABASE_PATH: /data/lavemill.sqlite3
      LAVEMILL_TIME_ZONE: ${LAVEMILL_TIME_ZONE:-Europe/London}
      LAVEMILL_ORIGIN: "${LAVEMILL_ORIGIN:-http://127.0.0.1:${LAVEMILL_PORT:-8080}}"
    healthcheck:
      # The HTML loading response stays open until the Dioxus build finishes.
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "--output", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      # Allow cold builds to finish. Dioxus exits immediately on a build error.
      start_period: 30m
    ports:
      - "127.0.0.1:${LAVEMILL_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: cargo-registry
        target: /usr/local/cargo/registry
      - type: volume
        source: cargo-git
        target: /usr/local/cargo/git
      - type: volume
        source: build-cache
        target: /app/target
      - type: volume
        source: household-data
        target: /data

  sqlite-web:
    image: ghcr.io/coleifer/sqlite-web@sha256:ec3c5811216fa5f7313e9f7269e1a1ca9c1f24f5f5ac3668c1f398c97afa362b
    depends_on:
      app:
        condition: service_healthy
    command: ["--read-only", "/data/lavemill.sqlite3"]
    ports:
      - "127.0.0.1:${LAVEMILL_DB_VIEWER_PORT:-8082}:8080"
    volumes:
      # SQLite may need to create WAL coordination files even for read-only queries.
      - household-data:/data

volumes:
  cargo-registry:
  cargo-git:
  build-cache:
  household-data:

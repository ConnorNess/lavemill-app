[package]
name = "lavemill-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
dioxus = { version = "=0.7.3", features = ["router", "fullstack"] }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
argon2 = { version = "0.5", optional = true }
getrandom = { version = "0.3", optional = true }
rpassword = { version = "7", optional = true }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["rt", "sync"], optional = true }
url = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["now"], optional = true }
chrono-tz = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["web"]
web = ["dioxus/web"]
server = [
    "dioxus/server", "dep:rusqlite", "dep:argon2", "dep:getrandom", "dep:rpassword",
    "dep:base64", "dep:sha2", "dep:tokio", "dep:url", "dep:chrono", "dep:chrono-tz",
]

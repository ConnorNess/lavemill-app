[package]
name = "lavemill-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
dioxus = { version = "=0.7.3", features = ["router", "fullstack"] }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server", "dep:rusqlite"]
